[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxy-light"
version = "0.1.0"
description = "Real-time messaging application"
requires-python = ">=3.14"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fluxy_light*"]
namespaces = false